name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XCODE_DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select and report toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          if [ -n "${XCODE_DEVELOPER_DIR:-}" ]; then
            export DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
            printf 'DEVELOPER_DIR=%s\n' "$XCODE_DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcode-select --print-path
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          XCODE_VERSION="$xcode_version" python3 - <<'PY'
          import os
          import re

          version = tuple(int(part) for part in re.findall(r"\d+", os.environ["XCODE_VERSION"])[:2])
          if version < (16, 4):
              raise SystemExit(f"Xcode 16.4 or later required; found {os.environ['XCODE_VERSION']}")
          PY
          xcodebuild -version
          swift --version
          python3 --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Fetch ClearURLs build resource and generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/fetch-clearurls-rules.sh --force
          xcodegen generate --spec project.yml
          test -f Sidekick.xcodeproj/project.pbxproj

      - name: Validate repository metadata and build-time client ID
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/check-package-locks.py
          python3 -B scripts/check-project-metadata.py
          python3 -B scripts/check-client-id.py
          git diff --check

      - name: Install SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint
          fi

      - name: Run mandatory SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          test -f .swiftlint.yml
          swiftlint lint --config .swiftlint.yml

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Sidekick.xcodeproj \
            -scheme sidekick \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SDKROOT=auto \
            test

      - name: Build Release configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Sidekick.xcodeproj \
            -scheme sidekick \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SDKROOT=auto \
            build